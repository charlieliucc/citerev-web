<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src https://api.crossref.org https://api.openalex.org; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>引用审查 CiteRev - 交稿前，先用引用审查</title>
  <link rel="stylesheet" href="workspace.css?v=20260818-typing-slogan">
  <link rel="stylesheet" href="nav.css">
  <script src="reference-splitter.js"></script>
  <script src="pdf-import.js?v=20260911-pdf2"></script>
  <script src="report-engine.js?v=20260818-rich2"></script>
</head>
<body>
  <header class="workspace-top cr-topbar">
    <a class="cr-brand" href="index.html" aria-label="引用审查网页版首页">
      <img class="logo" src="logo.png" alt="">
      <span>引用审查 CiteRev</span>
      <small>Web</small>
    </a>
    <nav class="cr-mainnav workspace-nav" aria-label="功能导航">
      <button class="workspace-tab active" id="workspaceStartNav" type="button" aria-current="page">开始</button>
      <button class="workspace-tab" data-workspace-tab="full" type="button">全文检查</button>
      <button class="workspace-tab" data-workspace-tab="format" type="button">格式检查</button>
      <button class="workspace-tab" data-workspace-tab="verify" type="button">真伪检查</button>
      <button class="workspace-tab" data-workspace-tab="dist" type="button">分析分布</button>
      <button class="workspace-tab" data-workspace-tab="report" type="button">一键分析</button>
      <a class="workspace-tab" href="about.html">关于</a>
    </nav>
  </header>
  <div class="workspace-subnav" aria-label="文档操作">
    <div class="workspace-actions">
      <button class="workspace-btn" id="workspaceImport">导入 Word / PDF</button>
      <button class="workspace-btn" id="workspaceClear">清空</button>
      <button type="button" class="workspace-start-btn" id="workspaceStartBtn">开始</button>
      <span class="workspace-file-name" id="workspaceFileName" hidden></span>
      <input id="workspaceFile" type="file" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </div>
  </div>
  <main>
    <div class="workspace-slogan" aria-label="引用审查功能介绍">
      <span id="sloganLead" aria-hidden="true"></span><strong id="sloganAccent" aria-hidden="true"></strong><i class="workspace-slogan-caret" aria-hidden="true"></i>
    </div>
    <section class="workspace-start" id="workspaceStart">
      <h1>先导入或粘贴文档</h1>
      <p>Word 与 PDF 文档只在浏览器本地解析。粘贴内容后，点击顶部的全文检查、格式检查、真伪检查或一键分析进入对应功能。</p>
      <div id="workspaceInput" class="workspace-input" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" data-placeholder="粘贴论文全文，或粘贴参考文献列表……"></div>
      <p class="workspace-message" id="workspaceMessage" aria-live="polite"></p>
    </section>
    <section class="workspace-main" id="workspaceMain" hidden>
      <iframe class="workspace-frame" id="workspaceFrame" title="引用审查功能"></iframe>
    </section>
  </main>
  <script src="workspace.js?v=20260911-pdf2"></script>
</body>
</html>
